<text x="40" y="1273" class="section">04  BACKEND-ONLY PERSISTENCE</text>
<rect x="40" y="1300" width="470" height="170" rx="14" fill="#eef8f6" stroke="#8bbcb4" stroke-width="1.6"/>
<text x="58" y="1331" class="name">Supabase / PostgreSQL</text>
<text x="58" y="1359" class="body">Sources, commitments, decisions and memories</text>
<text x="58" y="1382" class="body">Documents / versions / chunks / vectors</text>
<text x="58" y="1405" class="body">Audit, policies and durable delivery records</text>
<text x="58" y="1428" class="body">Documents and lifecycle still depend on cloud</text>
<rect x="535" y="1300" width="525" height="170" rx="14" fill="#fff7e6" stroke="#d3a246" stroke-width="1.6"/>
<text x="553" y="1331" class="name">SQLite engine adapters</text>
<text x="553" y="1359" class="body">Records, memory vectors, profiles and reminders</text>
<text x="553" y="1382" class="body">Retention, quota and cloud-to-local copy tooling</text>
<text x="553" y="1405" class="body">Selected modules only; not full engine parity</text>
<text x="553" y="1428" class="body">No continuous two-way synchronization</text>
<rect x="1100" y="1230" width="500" height="110" rx="14" fill="#eef8f6" stroke="#8bbcb4" stroke-width="1.6"/>
