<text x="62" y="1587" class="section">HOW TO READ THIS DIAGRAM</text>
<text x="62" y="1618" class="body">Solid paths = code relationships, not hosted verification. Amber = incomplete or policy-gated. Red = security gap.</text>
<text x="62" y="1648" class="body">Current evidence: Discord PDF save reported; cited retrieval blocked by adapter setup; Slack documents unfinished.</text>
<text x="62" y="1677" class="body">Fresh-install SQL resets tables. Existing hosted data requires reviewed non-destructive upgrades and approval.</text>
